# Mouser categories for the Supplier Part Import plugin, same format as the Ki-nTree
# digikey_categories.yaml. Names: the 'Category' of the Mouser products, from sample parts (2026-10-30).
# InvenTree category -> subcategory -> [supplier categories]. "__Name": subcategory chosen by "Function Type"
